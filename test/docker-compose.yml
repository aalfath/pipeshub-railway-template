# Local test of the Railway template (same variables as the template, values from test.env).
# docker compose -f test/docker-compose.yml --env-file test/test.env up -d --build
services:
  pipeshub:
    build: ../app
    environment:
      PORT: "8080"
      SECRET_KEY: ${SECRET_KEY}
      MONGO_URI: mongodb://admin:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      QDRANT_HOST: qdrant
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      PIPESHUB_ADMIN_EMAIL: admin@example.com
      PIPESHUB_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports: ["18080:8080"]
    volumes: [pipeshub:/data/pipeshub]
  mongodb:
    build: ../mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes: [mongodb:/data/db]
  redis:
    build: ../redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: [redis:/data]
  qdrant:
    build: ../qdrant
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes: [qdrant:/qdrant/storage]
  neo4j:
    build: ../neo4j
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes: [neo4j:/data]
volumes: {pipeshub: {}, mongodb: {}, redis: {}, qdrant: {}, neo4j: {}}
